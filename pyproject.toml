[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ego-anno-client"
version = "0.1.0"
description = "Zero-dependency Python client and CLI for ego-anno annotations"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "DexGEM-Lab" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
ego-anno = "ego_anno.cli:main"

[project.urls]
Repository = "https://github.com/DexGEM-Lab/ego-anno-client"

[tool.hatch.build.targets.wheel]
packages = ["src/ego_anno"]

[tool.pytest.ini_options]
testpaths = ["tests"]
