[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ego-anno-client"
version = "0.6.0"
description = "Python client and CLI for ego-anno annotation and optional offline visualization"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "DexGEM-Lab" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
render = ["numpy>=1.24,<3", "opencv-python-headless==4.11.0.86"]

[project.scripts]
ego-anno = "ego_anno.cli:main"

[project.urls]
Repository = "https://github.com/DexGEM-Lab/ego-anno-client"

[tool.hatch.build.targets.wheel]
packages = ["src/ego_anno"]

[tool.pytest.ini_options]
testpaths = ["tests"]
